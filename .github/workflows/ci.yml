name: CI

# Pull requests only. Pushes to main are validated by release.yml, which runs
# the same checks before it tags — running both would just duplicate the work.
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Reports unconfirmed content without failing the build — these are
      # things Vernon still owes, not defects in the code.
      - name: Open content items
        run: pnpm check:tk || true
