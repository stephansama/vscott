[build]
  publish = "dist"
  command = "pnpm build"

[build.environment]
  # Kept in step with .mise.toml (node = "lts").
  NODE_VERSION = "24"

# ---------------------------------------------------------------------------
# Security headers. The site is fully static with no third-party origins —
# fonts are self-hosted via @fontsource, icons are a build-time sprite — so the
# CSP can stay strict. 'unsafe-inline' on script-src covers the pre-paint theme
# resolver and the skills toggle, both of which must run inline by design.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

# Astro fingerprints everything under /_astro, so it can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
